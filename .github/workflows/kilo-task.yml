name: KiloCode Task Runner (Optional)

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Chemin du fichier de tâche dans .kilo/tasks/'
        required: true
        type: string
      wait_for_build:
        description: 'Attendre le build iOS après la tâche'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  run-kilo-task:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node (for KiloCode if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install KiloCode CLI
        run: |
          # Installation via npm (ou téléchargement binaire)
          npm install -g @kilocode/cli@latest
          kilo --version

      - name: Configure Git
        run: |
          git config user.name "kilo-bot"
          git config user.email "kilo-bot@users.noreply.github.com"

      - name: Read task file
        id: task
        run: |
          TASK_FILE="${{ github.event.inputs.task_file }}"
          if [ ! -f "$TASK_FILE" ]; then
            echo "Task file not found: $TASK_FILE"
            exit 1
          fi
          echo "task_content<<EOF" >> $GITHUB_OUTPUT
          cat "$TASK_FILE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Extraire task_id pour nom de branche
          TASK_ID=$(cat "$TASK_FILE" | jq -r '.id // "task-unknown"')
          BRANCH=$(cat "$TASK_FILE" | jq -r '.scope.branch // "kilo/auto-task"')
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create/Switch branch
        run: |
          BRANCH="${{ steps.task.outputs.branch }}"
          if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Run KiloCode task
        id: kilo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PROMPT=$(echo '${{ steps.task.outputs.task_content }}' | jq -r '.prompt')
          kilo run --format json --title "CI Task: ${{ steps.task.outputs.task_id }}" --dir . "$PROMPT" 2>&1 | tee kilo-output.log
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.kilo.outputs.EXIT_CODE == '0'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "kilo: ${{ steps.task.outputs.task_id }} — ${{ github.event.inputs.task_file }}"
            git push origin HEAD:${{ steps.task.outputs.branch }}
            echo "changed=true" >> $GITHUB_OUTPUT

      - name: Wait for iOS build
        if: github.event.inputs.wait_for_build == 'true' && steps.kilo.outputs.EXIT_CODE == '0'
        id: build
        run: |
          # Attendre que le workflow "Build Nexora" se termine pour cette branche
          BRANCH="${{ steps.task.outputs.branch }}"
          MAX_WAIT=1800  # 30 min
          POLL=30
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RUN_ID=$(gh run list --repo mthxdev/NEXORA --limit 5 --json databaseId,status,conclusion,headBranch,workflowName --jq '.[] | select(.headBranch=="'"$BRANCH"'" and .workflowName=="Build Nexora") | .databaseId' | head -1)
            if [ -n "$RUN_ID" ]; then
              STATUS=$(gh run view $RUN_ID --repo mthxdev/NEXORA --json status,conclusion --jq '.status')
              if [ "$STATUS" = "completed" ]; then
                CONCLUSION=$(gh run view $RUN_ID --repo mthxdev/NEXORA --json conclusion --jq '.conclusion')
                echo "build_status=$CONCLUSION" >> $GITHUB_OUTPUT
                echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
                
                # Récupérer URL IPA
                IPA_URL=$(gh run view $RUN_ID --repo mthxdev/NEXORA --json artifacts --jq '.artifacts[] | select(.name=="Nexora-ipa") | .url')
                echo "ipa_url=$IPA_URL" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            sleep $POLL
            ELAPSED=$((ELAPSED + POLL))
          done
          echo "build_status=timeout" >> $GITHUB_OUTPUT

      - name: Generate report
        id: report
        run: |
          REPORT=$(cat <<EOF
          {
            "task_id": "${{ steps.task.outputs.task_id }}",
            "status": "${{ steps.kilo.outputs.EXIT_CODE == '0' && 'completed' || 'failed' }}",
            "kilo_exit_code": ${{ steps.kilo.outputs.EXIT_CODE }},
            "git": {
              "branch": "${{ steps.task.outputs.branch }}",
              "changed": ${{ steps.commit.outputs.changed == 'true' && 'true' || 'false' }}
            },
            "build": {
              "triggered": ${{ github.event.inputs.wait_for_build == 'true' && 'true' || 'false' }},
              "workflow_run_id": "${{ steps.build.outputs.run_id }}",
              "status": "${{ steps.build.outputs.build_status }}",
              "ipa_url": "${{ steps.build.outputs.ipa_url }}",
              "icon_verification": "${{ steps.build.outputs.build_status == 'success' && 'passed' || 'failed' }}"
            },
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          )
          echo "$REPORT" > kilo-task-report.json
          cat kilo-task-report.json
          
          # Upload as artifact
          echo "report_path=kilo-task-report.json" >> $GITHUB_OUTPUT

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilo-task-report
          path: kilo-task-report.json
          retention-days: 30

      - name: Comment on PR (if exists)
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Tenter de trouver/create PR
          PR_NUMBER=$(gh pr list --repo mthxdev/NEXORA --head "${{ steps.task.outputs.branch }}" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment $PR_NUMBER --repo mthxdev/NEXORA --body "$(cat kilo-task-report.json | jq -r '\"**KiloCode Task Report**\n\n- Task: \(.task_id)\n- Status: \(.status)\n- Build: \(.build.status)\n- IPA: \(.build.ipa_url)\"' )"
          fi