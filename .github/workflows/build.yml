name: Build Nexora

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Select Xcode
        run: |
          xcode_path=/Applications/Xcode_16.4.app/Contents/Developer
          if [ ! -d "$xcode_path" ]; then
            echo "Xcode 16.4 was not found at $xcode_path" >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version | tee xcode-version.txt
          grep -q '^Xcode 16\.4$' xcode-version.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Downgrade Project Format
        run: |
          # Force the project objectVersion back to 56 (Xcode 15 compatible)
          # to bypass the format 77 error without triggering Xcode 16's actool bug.
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/g' Nexora.xcodeproj/project.pbxproj

      - name: Clean build directory
        run: rm -rf build

      - name: Build app
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Nexora.xcodeproj \
            -scheme Nexora \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build 2>&1 | tee build.log
          echo "BUILD_STATUS=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Show build errors
        if: failure()
        run: |
          echo "=== FULL BUILD LOG ==="
          cat build.log
          echo ""
          echo "=== ANNOTATING ERRORS ==="
          grep -iE 'error:' build.log | head -100 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Package IPA
        run: |
          app_path=build/Build/Products/Release-iphoneos/Nexora.app
          test -d "$app_path"
          test -f "$app_path/Info.plist"
          mkdir -p Payload
          cp -R "$app_path" Payload/
          zip -qr Nexora.ipa Payload
          test -s Nexora.ipa
          unzip -t Nexora.ipa
          python3 -c 'import sys, zipfile; z=zipfile.ZipFile(sys.argv[1]); names=z.namelist(); assert "Payload/Nexora.app/Info.plist" in names, "IPA is missing Payload/Nexora.app/Info.plist"' Nexora.ipa

      - name: Verify icon in built app
        run: |
          python3 Tools/verify_ipa_icon.py Nexora.ipa Payload/Nexora.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-ipa
          path: Nexora.ipa
          retention-days: 90
