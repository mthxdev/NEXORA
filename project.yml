            - AppIcon-Classic-29@3x.png
            - AppIcon-Classic-40@2x.png
            - AppIcon-Classic-40@3x.png
            - AppIcon-Classic-60@2x.png
            - AppIcon-Classic-60@3x.png
            - AppIcon-Classic-20~ipad.png
            - AppIcon-Classic-20~ipad@2x.png
            - AppIcon-Classic-29@1x.png
            - AppIcon-Classic-29@2x.png
            - AppIcon-Classic-40@1x.png
