name: Nexora
options:
  bundleIdPrefix: com.mathieu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  Nexora:
    type: application
    platform: iOS
    sources:
      - Nexora
    # Ne PAS déclarer Assets.xcassets dans `resources` : il est déjà compilé
    # par le target via `sources`. Le déclarer deux fois dupliquait
    # Assets.car dans le bundle et pouvait faire échouer actool.
    frameworks:
      - System: UserNotifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathieu.musculog
        MARKETING_VERSION: "2.0"
        # Incrémenté à chaque livraison : SpringBoard ne régénère pas le cache
        # d'icônes si CFBundleVersion ne change pas.
        CURRENT_PROJECT_VERSION: 10
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nexora
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Gradient AppIcon-Minimal AppIcon-Bold AppIcon-Mono"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NexoraIconTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/NexoraIconTests.swift
    dependencies:
      - target: Nexora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathieu.musculog.icon-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"

schemes:
  Nexora:
    build:
      targets:
        Nexora: all
        NexoraIconTests: [test]
    test:
      config: Debug
      targets:
        - NexoraIconTests
