name: Nexora
options:
  bundleIdPrefix: com.mathieu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  Nexora:
    type: application
    platform: iOS
    sources:
      - Nexora
    # Ne PAS déclarer Assets.xcassets dans `resources` : il est déjà compilé
    # par le target via `sources`. Le déclarer deux fois dupliquait
    # Assets.car dans le bundle et pouvait faire échouer actool.
    frameworks:
      - System: UserNotifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathieu.musculog
        MARKETING_VERSION: "2.0"
        # Incrémenté à chaque livraison : SpringBoard ne régénère pas le cache
        # d'icônes si CFBundleVersion ne change pas.
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nexora
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleAlternateIcons: {
            "AppIcon-Classic" = {
                CFBundleIconFiles = (
                    "AppIcon-20@2x.png",
